<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรายงานเวรประจำวันโรงเรียน</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- html5-qrcode for In-App Live QR Code Scanning -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .animate-scaleIn { animation: scaleIn 0.2s ease-out forwards; }
    
    @media print {
      body { background-color: white !important; color: black !important; font-size: 12px; }
      .no-print { display: none !important; }
      .print-full-width { width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; }
      table { border-collapse: collapse !important; width: 100% !important; }
      th, td { border: 1px solid #000 !important; padding: 6px 8px !important; }
    }
  </style>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (For processing JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  
  <!-- Root element for React -->
  <div id="root"></div>

  <!-- React Application Code -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAnalytics } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { 
      getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc, serverTimestamp, setDoc
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const { useState, useEffect, useRef } = React;

    const FAIcon = ({ icon, className }) => <i className={`${icon} ${className || ''}`} style={{ fontSize: '1.1em', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></i>;
    
    // UI Icons
    const Camera = ({ className }) => <FAIcon icon="fas fa-camera" className={className} />;
    const QrCode = ({ className }) => <FAIcon icon="fas fa-qrcode" className={className} />;
    const MapPin = ({ className }) => <FAIcon icon="fas fa-map-marker-alt" className={className} />;
    const Clock = ({ className }) => <FAIcon icon="far fa-clock" className={className} />;
    const CheckCircle = ({ className }) => <FAIcon icon="fas fa-check-circle" className={className} />;
    const AlertTriangle = ({ className }) => <FAIcon icon="fas fa-exclamation-triangle" className={className} />;
    const Settings = ({ className }) => <FAIcon icon="fas fa-cog" className={className} />;
    const FileText = ({ className }) => <FAIcon icon="fas fa-file-alt" className={className} />;
    const User = ({ className }) => <FAIcon icon="fas fa-user" className={className} />;
    const Shield = ({ className }) => <FAIcon icon="fas fa-shield-alt" className={className} />;
    const ImageIcon = ({ className }) => <FAIcon icon="fas fa-image" className={className} />;
    const Plus = ({ className }) => <FAIcon icon="fas fa-plus" className={className} />;
    const Trash2 = ({ className }) => <FAIcon icon="fas fa-trash-alt" className={className} />;
    const Edit3 = ({ className }) => <FAIcon icon="fas fa-edit" className={className} />;
    const Save = ({ className }) => <FAIcon icon="fas fa-save" className={className} />;
    const X = ({ className }) => <FAIcon icon="fas fa-times" className={className} />;
    const Calendar = ({ className }) => <FAIcon icon="far fa-calendar-alt" className={className} />;
    const Printer = ({ className }) => <FAIcon icon="fas fa-print" className={className} />;
    const Download = ({ className }) => <FAIcon icon="fas fa-download" className={className} />;
    const Lock = ({ className }) => <FAIcon icon="fas fa-lock" className={className} />;
    const Key = ({ className }) => <FAIcon icon="fas fa-key" className={className} />;
    const LogOut = ({ className }) => <FAIcon icon="fas fa-sign-out-alt" className={className} />;
    const Sliders = ({ className }) => <FAIcon icon="fas fa-sliders-h" className={className} />;
    const Database = ({ className }) => <FAIcon icon="fas fa-database" className={className} />;

    const firebaseConfig = {
      apiKey: "AIzaSyDNwMXX7sewiMGAwI3StFssKbApbEsrGZ0",
      authDomain: "teppitakschool-8ec4f.firebaseapp.com",
      projectId: "teppitakschool-8ec4f",
      storageBucket: "teppitakschool-8ec4f.firebasestorage.app",
      messagingSenderId: "62988582755",
      appId: "1:62988582755:web:62345ca8c2973153715d56",
      measurementId: "G-548SXKTJH0"
    };

    const app = initializeApp(firebaseConfig);
    let analytics;
    if (typeof window !== 'undefined') {
      analytics = getAnalytics(app);
    }
    const auth = getAuth(app);
    const db = getFirestore(app);

    const dutyAppId = "teppitakschool"; 

    const ROLES = {
      REPORTER: 'ผู้รายงานเวร',
      INSPECTOR: 'ผู้ตรวจเวร',
      HEAD: 'หัวหน้าฝ่าย',
      EXECUTIVE: 'ผู้บริหาร',
      ADMIN: 'แอดมิน (ผู้ดูแลระบบ)'
    };

    // Default Configuration (used if DB config is not found)
    const DEFAULT_SETTINGS = {
      schoolName: 'ระบบรายงานเวรประจำวัน',
      pins: {
        admin: '9999',
        executive: '8888',
        head: '5555',
        inspector: '1234'
      },
      shifts: [
        { id: 'morning', label: 'เช้า (ก่อนเข้าเรียน)', time: '06.30 - 08.00 น.' },
        { id: 'lunch', label: 'พักเช้า - กลางวัน', time: '11.30 - 12.30 น.' },
        { id: 'evening', label: 'เย็นหลังเลิกเรียน', time: '15.30 - 17.00 น.' }
      ]
    };

    const checkIsToday = (timestamp) => {
      if (!timestamp) return false;
      const date = new Date(timestamp);
      const today = new Date();
      return date.getDate() === today.getDate() &&
             date.getMonth() === today.getMonth() &&
             date.getFullYear() === today.getFullYear();
    };

    function App() {
      const [user, setUser] = useState(null);
      const [activeRole, setActiveRole] = useState(ROLES.REPORTER);
      const [dutyPoints, setDutyPoints] = useState([]);
      const [reports, setReports] = useState([]);
      const [dailyComments, setDailyComments] = useState([]); 
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const [confirmModal, setConfirmModal] = useState({ show: false, message: '', onConfirm: null });
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [pinInput, setPinInput] = useState('');

      const [scannedPoint, setScannedPoint] = useState(null);
      const [teacherName, setTeacherName] = useState('');
      const [previewImage, setPreviewImage] = useState(null);

      const triggerToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => {
          setToast(prev => ({ ...prev, show: false }));
        }, 4000);
      };

      const triggerConfirm = (message, action) => {
        setConfirmModal({
          show: true,
          message,
          onConfirm: () => {
            action();
            setConfirmModal({ show: false, message: '', onConfirm: null });
          }
        });
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === settings.pins.admin) {
          setActiveRole(ROLES.ADMIN);
          setShowLoginModal(false);
          setPinInput('');
          triggerToast('เข้าสู่ระบบสิทธิ์ "แอดมิน" สำเร็จ', 'success');
        } else if (pinInput === settings.pins.executive) {
          setActiveRole(ROLES.EXECUTIVE);
          setShowLoginModal(false);
          setPinInput('');
          triggerToast('เข้าสู่ระบบสิทธิ์ "ผู้บริหาร" สำเร็จ', 'success');
        } else if (pinInput === settings.pins.head) {
          setActiveRole(ROLES.HEAD);
          setShowLoginModal(false);
          setPinInput('');
          triggerToast('เข้าสู่ระบบสิทธิ์ "หัวหน้าฝ่าย" สำเร็จ', 'success');
        } else if (pinInput === settings.pins.inspector) {
          setActiveRole(ROLES.INSPECTOR);
          setShowLoginModal(false);
          setPinInput('');
          triggerToast('เข้าสู่ระบบสิทธิ์ "ผู้ตรวจเวร" สำเร็จ', 'success');
        } else {
          triggerToast('รหัส PIN ไม่ถูกต้อง กรุณาลองใหม่', 'error');
          setPinInput('');
        }
      };

      const handleLogout = () => {
        setActiveRole(ROLES.REPORTER);
        triggerToast('ออกจากระบบ กลับสู่หน้าสำหรับผู้รายงานเวร', 'success');
      };

      useEffect(() => {
        const initAuth = async () => {
          try {
            await signInAnonymously(auth);
          } catch (err) {
            console.error("Auth Error:", err);
            setErrorMsg("ไม่สามารถเชื่อมต่อระบบยืนยันตัวตนได้ กรุณาตรวจสอบการตั้งค่า Authentication ใน Firebase");
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;

        // Fetch Settings Configuration
        const settingsRef = doc(db, 'artifacts', dutyAppId, 'public', 'data', 'settings', 'config');
        const unsubscribeSettings = onSnapshot(settingsRef, (docSnap) => {
          if (docSnap.exists()) {
            setSettings(prev => ({ ...prev, ...docSnap.data() }));
          } else {
            // Set default settings if not exists
            setDoc(settingsRef, DEFAULT_SETTINGS).catch(e => console.log(e));
          }
        });

        // Fetch Duty Points
        const pointsRef = collection(db, 'artifacts', dutyAppId, 'public', 'data', 'dutyPoints');
        const unsubscribePoints = onSnapshot(pointsRef, (snapshot) => {
          const pointsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setDutyPoints(pointsData);
        }, (err) => console.error("Error fetching points:", err));

        // Fetch Reports
        const reportsRef = collection(db, 'artifacts', dutyAppId, 'public', 'data', 'reports');
        const unsubscribeReports = onSnapshot(reportsRef, (snapshot) => {
          const reportsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          reportsData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          setReports(reportsData);
        }, (err) => console.error("Error fetching reports:", err));

        // Fetch Daily Comments
        const commentsRef = collection(db, 'artifacts', dutyAppId, 'public', 'data', 'dailyComments');
        const unsubscribeComments = onSnapshot(commentsRef, (snapshot) => {
          const commentsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setDailyComments(commentsData);
        }, (err) => console.error("Error fetching daily comments:", err));

        return () => {
          unsubscribeSettings();
          unsubscribePoints();
          unsubscribeReports();
          unsubscribeComments();
        };
      }, [user]);

      useEffect(() => {
        if (dutyPoints.length === 0) return;
        const params = new URLSearchParams(window.location.search);
        const pointIdParam = params.get('pointId');
        
        if (pointIdParam) {
          const matchedPoint = dutyPoints.find(p => p.id === pointIdParam);
          if (matchedPoint) {
            setScannedPoint(matchedPoint);
            setActiveRole(ROLES.REPORTER);
            triggerToast(`เข้าสู่จุดลงเวลา: ${matchedPoint.name}`, 'success');
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        }
      }, [dutyPoints]);

      if (loading) {
        return (
          <div className="flex items-center justify-center h-screen bg-gray-50">
            <div className="text-center">
              <div className="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <div className="text-xl font-semibold text-gray-600">กำลังเชื่อมต่อฐานข้อมูล...</div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-100 font-sans text-gray-800 flex flex-col justify-between">
          <header className="bg-indigo-700 shadow-md sticky top-0 z-40 no-print">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between text-white">
              <div className="flex items-center gap-2">
                <Shield className="w-7 h-7 text-indigo-200" />
                <h1 className="font-bold text-lg hidden sm:block">{settings.schoolName}</h1>
                <h1 className="font-bold text-lg sm:hidden">ระบบเวร</h1>
              </div>
              
              <div className="flex items-center gap-3">
                {activeRole === ROLES.REPORTER ? (
                  <button 
                    onClick={() => setShowLoginModal(true)}
                    className="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-800 hover:bg-indigo-900 rounded-md text-sm font-medium transition-colors border border-indigo-600"
                  >
                    <Key className="w-4 h-4" /> <span className="hidden sm:inline">สำหรับเจ้าหน้าที่</span>
                  </button>
                ) : (
                  <div className="flex items-center gap-4">
                    <span className="text-sm font-semibold bg-indigo-600 px-3 py-1 rounded-full border border-indigo-500">
                      สิทธิ์: {activeRole}
                    </span>
                    <button 
                      onClick={handleLogout}
                      className="flex items-center gap-1.5 px-3 py-1.5 bg-red-600 hover:bg-red-700 rounded-md text-sm font-medium transition-colors"
                    >
                      <LogOut className="w-4 h-4" /> <span className="hidden sm:inline">ออกจากระบบ</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-6xl w-full mx-auto px-4 py-6 flex-grow print:p-0 print:max-w-full">
            {errorMsg && (
              <div className="mb-4 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-md no-print">
                {errorMsg}
              </div>
            )}

            {/* ROUTING VIEWS */}
            {activeRole === ROLES.REPORTER && (
              <ReporterView 
                user={user} 
                dutyPoints={dutyPoints} 
                reports={reports} 
                scannedPoint={scannedPoint}
                setScannedPoint={setScannedPoint}
                triggerToast={triggerToast}
                teacherName={teacherName}
                setTeacherName={setTeacherName}
                onViewImage={setPreviewImage}
                settings={settings}
              />
            )}
            {(activeRole === ROLES.INSPECTOR || activeRole === ROLES.HEAD || activeRole === ROLES.EXECUTIVE) && (
              <InspectorView 
                dutyPoints={dutyPoints} 
                reports={reports} 
                dailyComments={dailyComments}
                triggerToast={triggerToast} 
                activeRole={activeRole} 
                onViewImage={setPreviewImage}
                settings={settings}
              />
            )}
            {activeRole === ROLES.ADMIN && (
              <AdminView 
                dutyPoints={dutyPoints} 
                reports={reports} 
                dailyComments={dailyComments}
                triggerToast={triggerToast} 
                triggerConfirm={triggerConfirm} 
                onViewImage={setPreviewImage}
                settings={settings}
              />
            )}
          </main>

          {}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-scaleIn">
              <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6">
                <div className="flex justify-between items-center mb-5">
                  <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <Key className="w-5 h-5 text-indigo-600" /> เข้าสู่ระบบเจ้าหน้าที่
                  </h3>
                  <button onClick={() => {setShowLoginModal(false); setPinInput('');}} className="text-gray-400 hover:text-gray-600 p-1 bg-gray-100 rounded-full">
                    <X className="w-5 h-5" />
                  </button>
                </div>
                
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">รหัส PIN 4 หลัก</label>
                    <input 
                      type="password" 
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      placeholder="****"
                      maxLength={4}
                      autoFocus
                      className="w-full px-3 py-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-center text-xl tracking-[1em] font-bold"
                    />
                  </div>
                  <button 
                    type="submit"
                    className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-md transition-colors mt-2"
                  >
                    ยืนยันการเข้าสู่ระบบ
                  </button>
                </form>
              </div>
            </div>
          )}

          {previewImage && (
            <div 
              className="fixed inset-0 bg-black/65 z-[100] flex items-center justify-center p-4 backdrop-blur-sm no-print"
              onClick={() => setPreviewImage(null)}
            >
              <div 
                className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden animate-scaleIn border border-gray-100 flex flex-col relative"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                  <h4 className="font-bold text-gray-800 flex items-center gap-2 text-md">
                    <MapPin className="text-indigo-600" /> {previewImage.pointName}
                  </h4>
                  <button 
                    onClick={() => setPreviewImage(null)}
                    className="text-gray-400 hover:text-gray-600 p-1.5 hover:bg-gray-200 rounded-full transition-colors flex items-center justify-center"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>
                
                <div className="bg-gray-950 flex justify-center items-center h-80 sm:h-96">
                  <img 
                    src={previewImage.url} 
                    alt="Expanded Watermarked View" 
                    className="max-w-full max-h-full object-contain" 
                  />
                </div>
                
                <div className="p-4 border-t border-gray-100 bg-gray-50 text-center space-y-1">
                  <p className="text-sm font-semibold text-gray-700 flex items-center justify-center gap-1">
                    <Clock className="w-4 h-4 text-indigo-500" /> {previewImage.timeString}
                  </p>
                  <p className="text-xs text-gray-500">
                    ผู้ปฏิบัติเวร: {previewImage.userName}
                  </p>
                </div>
              </div>
            </div>
          )}

          {toast.show && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center gap-3 p-4 rounded-lg shadow-xl text-white animate-bounce transition-all duration-300 bg-gray-900 border border-gray-800">
              {toast.type === 'success' ? <CheckCircle className="w-5 h-5 text-green-400" /> : <AlertTriangle className="w-5 h-5 text-red-400" />}
              <span className="text-sm font-medium">{toast.message}</span>
              <button onClick={() => setToast(prev => ({ ...prev, show: false }))} className="text-gray-400 hover:text-white ml-2">
                <X className="w-4 h-4" />
              </button>
            </div>
          )}

          {confirmModal.show && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-scaleIn">
              <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6">
                <h3 className="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2">
                  <AlertTriangle className="w-5 h-5 text-amber-500" /> ยืนยันการดำเนินการ
                </h3>
                <p className="text-gray-600 text-sm mb-6">{confirmModal.message}</p>
                <div className="flex gap-3 justify-end">
                  <button 
                    onClick={() => setConfirmModal({ show: false, message: '', onConfirm: null })}
                    className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg"
                  >
                    ยกเลิก
                  </button>
                  <button 
                    onClick={confirmModal.onConfirm}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow"
                  >
                    ยืนยัน
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ReporterView({ user, dutyPoints, reports, scannedPoint, setScannedPoint, triggerToast, teacherName, setTeacherName, onViewImage, settings }) {
      const [activeTab, setActiveTab] = useState('scan'); 
      const [selectedPoint, setSelectedPoint] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const scannerRef = useRef(null);

      useEffect(() => {
        if (scannedPoint) setSelectedPoint(scannedPoint);
      }, [scannedPoint]);

      useEffect(() => {
        return () => {
          if (scannerRef.current) {
            scannerRef.current.stop().catch(err => console.log(err));
          }
        };
      }, []);

      const myReports = reports.filter(r => r.userId === user.uid);

      useEffect(() => {
        if (myReports.length > 0 && !teacherName) {
          setTeacherName(myReports[0].userName);
        }
      }, [myReports, teacherName, setTeacherName]);

      const startInAppScanner = () => {
        setIsScanning(true);
        setTimeout(() => {
          try {
            const html5QrCode = new Html5Qrcode("in-app-qr-reader");
            scannerRef.current = html5QrCode;
            
            html5QrCode.start(
              { facingMode: "environment" },
              {
                fps: 10,
                qrbox: (width, height) => {
                  const size = Math.floor(Math.min(width, height) * 0.7);
                  return { width: size, height: size };
                }
              },
              (decodedText) => {
                let pointId = decodedText;
                if (decodedText.includes('pointId=')) {
                  try {
                    const url = new URL(decodedText);
                    pointId = url.searchParams.get('pointId');
                  } catch (e) {
                    const match = decodedText.match(/pointId=([^&]+)/);
                    if (match) pointId = match[1];
                  }
                }

                const matchedPoint = dutyPoints.find(p => p.id === pointId);
                if (matchedPoint) {
                  setSelectedPoint(matchedPoint);
                  triggerToast(`พบจุดเวร: ${matchedPoint.name}`, 'success');
                  stopInAppScanner();
                } else {
                  triggerToast('QR Code นี้ไม่ใช่จุดลงเวลาเวรของระบบ', 'error');
                }
              },
              (errorMessage) => { }
            ).catch(err => {
              console.error("Camera startup error:", err);
              triggerToast("ไม่สามารถเปิดกล้องสแกนได้ กรุณาอนุญาตสิทธิ์", "error");
              setIsScanning(false);
            });
          } catch (e) {
            console.error(e);
            setIsScanning(false);
          }
        }, 150);
      };

      const stopInAppScanner = () => {
        if (scannerRef.current) {
          scannerRef.current.stop().then(() => {
            setIsScanning(false);
            scannerRef.current = null;
          }).catch(err => {
            console.error(err);
            setIsScanning(false);
            scannerRef.current = null;
          });
        } else {
          setIsScanning(false);
        }
      };

              {!selectedPoint ? (

                  <div className="w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center mx-auto">
                    <QrCode className="w-12 h-12 text-indigo-600 animate-pulse" />
                  </div>
                  <div>
                    <h2 className="text-2xl font-bold text-gray-800">โปรดสแกน QR Code ประจำจุด</h2>
                    <p className="text-gray-500 mt-3 text-sm max-w-sm mx-auto bg-yellow-50 p-3 rounded-lg border border-yellow-200">
                      <AlertTriangle className="w-4 h-4 inline text-yellow-600 mb-0.5 mr-1" />
                      ระบบไม่อนุญาตให้เลือกจุดเอง กรุณาใช้กล้องมือถือสแกน QR Code ณ จุดตรวจเวรเพื่อดำเนินการต่อ
                    </p>
                  </div>
                  <div className="pt-2">
                    <button 
                      onClick={startInAppScanner}
                      className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center gap-2 mx-auto hover:scale-105"

                      <Camera className="text-white" /> สแกน QR Code ในแอปอีกครั้ง

              ) : (
                <ReportForm 
                  user={user} 
                  point={selectedPoint} 
                  onCancel={() => { setSelectedPoint(null); setScannedPoint(null); }}
                  onSuccess={() => {

                    setScannedPoint(null);
                    setActiveTab('history');
                    triggerToast('ส่งรายงานความคืบหน้าเข้าเวรสำเร็จแล้ว', 'success');
                  }}

                  teacherName={teacherName}
                  setTeacherName={setTeacherName}

          {activeTab === 'history' && (

              <div className="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                  <FileText className="w-5 h-5 text-indigo-600" /> ประวัติของคุณ
                </h2>
                <span className="text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded">
                  * ข้ามวันแล้วจะถูกล็อกแก้ไข

              </div>
              
              {myReports.length === 0 ? (
                <div className="p-8 text-center bg-white rounded-xl border border-gray-100 text-gray-400">
                  ยังไม่มีประวัติการรายงานเวรในระบบ
                </div>

                <div className="grid gap-4">
                  {myReports.map(report => (
                    <ReportCard

    function ReportForm({ user, point, onCancel, onSuccess, existingReport = null, triggerToast, teacherName, setTeacherName, settings }) {
      const [shift, setShift] = useState(existingReport?.shift || (settings.shifts.length > 0 ? settings.shifts[0].id : ''));
      const [status, setStatus] = useState(existingReport?.status || 'normal');
      const [detail, setDetail] = useState(existingReport?.detail || '');
      const [photoUrl, setPhotoUrl] = useState(existingReport?.photoUrl || null);
      const [currentName, setCurrentName] = useState(existingReport?.userName || teacherName || '');
      const [isSubmitting, setIsSubmitting] = useState(false);
      
      const fileInputRef = useRef(null);

      const applyWatermarkToImage = (imageSource, width, height) => {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(imageSource, 0, 0, width, height);

        const now = new Date();
        const timeStr = now.toLocaleString('th-TH', { dateStyle: 'long', timeStyle: 'medium' });
        const text1 = `บันทึกเวลาถ่าย: ${timeStr} น.`;
        const text2 = `สถานที่เข้าเวร: ${point.name}`;

        const barHeight = Math.max(60, height * 0.12);
        const fontSize = Math.max(14, height * 0.035);
        
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(0, height - barHeight, width, barHeight);

        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = "#FFD700"; 
        ctx.fillText(text1, 20, height - barHeight / 2 - 5);
        ctx.fillStyle = "#FFFFFF"; 
        ctx.fillText(text2, 20, height - barHeight / 2 + fontSize + 5);

        return canvas.toDataURL('image/jpeg', 0.8);
      };

      const handlePhotoCapture = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const MAX_WIDTH = 1200;
              let w = img.width;
              let h = img.height;
              if (w > MAX_WIDTH) {
                h = Math.round((h * MAX_WIDTH) / w);
                w = MAX_WIDTH;
              }
              const dataUrl = applyWatermarkToImage(img, w, h);
              setPhotoUrl(dataUrl);
              triggerToast("ประมวลผลรูปถ่ายและประทับตราน้ำเรียบร้อย", "success");
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      };

        if (!shift) {
          triggerToast('กรุณาเลือกรอบเวร', 'error'); return;
        }
        if (!photoUrl && !isDraft) {
          triggerToast('บังคับถ่ายรูปเช็คอินหน้างานเพื่อยืนยันการลงเวลา', 'error'); return;
        }

        setIsSubmitting(true);
        try {
          setTeacherName(currentName); 
          
          const reportData = {
            userId: user.uid,
            userName: currentName,
            pointId: point.id,
            shift: shift,
            status: status,
            detail: detail,
            photoUrl: photoUrl,
            isDraft: isDraft,
            updatedAt: serverTimestamp(),
          };

          if (existingReport) {
            if (!checkIsToday(existingReport.timestamp)) {
              triggerToast('ไม่อนุญาตให้แก้ไขรายงานที่ข้ามวันไปแล้ว', 'error');
              setIsSubmitting(false); return;
            }
            const docRef = doc(db, 'artifacts', dutyAppId, 'public', 'data', 'reports', existingReport.id);
            await updateDoc(docRef, reportData);
          } else {
            reportData.timestamp = Date.now();
            const colRef = collection(db, 'artifacts', dutyAppId, 'public', 'data', 'reports');
            await addDoc(colRef, reportData);
          }
          onSuccess();
        } catch (error) {
          console.error("Error saving:", error);
          triggerToast("เกิดข้อผิดพลาดในการบันทึก", "error");
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="p-5 sm:p-6 bg-white rounded-xl">
          <div className="flex items-center justify-between mb-6 border-b pb-4">
            <div>
              <span className="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded-md flex items-center gap-1 w-max">
                <Lock className="w-3 h-3" /> ล็อกพิกัดเวลาและภาพถ่าย
              </span>
              <h2 className="text-xl font-bold text-gray-800 mt-2 flex items-center gap-1">
                <MapPin className="w-5 h-5 text-indigo-600" /> {point.name}
              </h2>
            </div>
            <button onClick={onCancel} className="p-2 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100 transition-colors">
              <X className="w-6 h-6" />
            </button>
          </div>

          <div className="space-y-5">
            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">1. ชื่อ-สกุล ผู้ปฏิบัติเวร *</label>
              <input type="text" value={currentName} onChange={(e) => setCurrentName(e.target.value)} placeholder="เช่น นายครูใจดี มีความรับผิดชอบ" className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm bg-indigo-50/30" />
            </div>

            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">2. เลือกช่วงเวลาเวร</label>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {settings.shifts.map(s => (
                  <button key={s.id} onClick={() => setShift(s.id)} className={`p-3 text-sm font-bold rounded-lg border text-center transition-all flex flex-col items-center justify-center ${shift === s.id ? 'bg-indigo-50 border-indigo-500 text-indigo-700 ring-1 ring-indigo-500 shadow-sm' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}>
                    <span>{s.label}</span>
                    <span className={`text-xs font-normal mt-1 ${shift === s.id ? 'text-indigo-500' : 'text-gray-400'}`}>{s.time}</span>
                  </button>
                ))}
              </div>
            </div>

            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">
                3. ถ่ายรูปเช็คอินหน้างาน <span className="text-red-500 font-normal">(กล้องจะเปิดอัตโนมัติ)</span>
              </label>

              <input ref={fileInputRef} type="file" accept="image/*" capture="environment" onChange={handlePhotoCapture} className="hidden" />

              <div className="mt-1">
                {photoUrl ? (
                  <div className="relative w-full rounded-md overflow-hidden bg-gray-900 border-2 border-gray-300">
                    <img src={photoUrl} alt="Check-in Watermarked" className="w-full h-auto object-contain" />
                    <button onClick={() => setPhotoUrl(null)} className="absolute top-3 right-3 bg-red-500 text-white p-2 rounded-full hover:bg-red-600 shadow-md flex items-center gap-1 text-xs font-bold"><Trash2 className="w-4 h-4" /> ถ่ายใหม่</button>
                  </div>
                ) : (
                  <div onClick={() => fileInputRef.current?.click()} className="flex flex-col justify-center items-center px-6 py-10 border-2 border-gray-300 border-dashed rounded-lg bg-gray-50 hover:bg-indigo-50 transition-colors cursor-pointer group shadow-inner animate-pulse">
                    <div className="w-16 h-16 bg-white rounded-full shadow flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                      <Camera className="h-8 w-8 text-indigo-600 text-2xl" />
                    </div>
                    <span className="font-bold text-indigo-700 text-lg">เปิดแอปกล้องเพื่อถ่ายภาพ</span>
                    <p className="text-xs text-gray-500 mt-2 text-center">ภาพจะถูกประทับเวลาและสถานที่อัตโนมัติ</p>
                  </div>
                )}
              </div>
            </div>

            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">4. สรุปเหตุการณ์ปัจจุบัน</label>
              <div className="flex gap-4">
                <label className="flex items-center gap-2 cursor-pointer bg-green-50 px-4 py-2 rounded-lg border border-green-200">
                  <input type="radio" value="normal" checked={status === 'normal'} onChange={(e) => setStatus(e.target.value)} className="w-4 h-4 text-green-600" />
                  <span className="text-sm font-semibold text-green-700 flex items-center gap-1"><CheckCircle className="w-4 h-4" /> เหตุการณ์ปกติ</span>
                </label>
                <label className="flex items-center gap-2 cursor-pointer bg-red-50 px-4 py-2 rounded-lg border border-red-200">
                  <input type="radio" value="abnormal" checked={status === 'abnormal'} onChange={(e) => setStatus(e.target.value)} className="w-4 h-4 text-red-600" />
                  <span className="text-sm font-semibold text-red-700 flex items-center gap-1"><AlertTriangle className="w-4 h-4" /> ผิดปกติ</span>
                </label>
              </div>
            </div>

            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">
                5. รายละเอียดสถานการณ์ <span className="text-gray-400 font-normal">(บันทึกด่วนไว้เขียนทีหลัง "ภายในวันนี้" ได้)</span>
              </label>
              <textarea rows={3} value={detail} onChange={(e) => setDetail(e.target.value)} placeholder="ระบุรายละเอียดเหตุการณ์เพิ่มเติม..." className="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm" />
            </div>

            <div className="pt-4 flex flex-col sm:flex-row gap-3 border-t">
              <button onClick={() => handleSave(false)} disabled={isSubmitting} className="flex-1 inline-flex justify-center items-center gap-2 px-4 py-3 bg-indigo-600 text-white rounded-md font-bold hover:bg-indigo-700 disabled:bg-indigo-300 transition-colors shadow-md">
                <Save className="w-5 h-5" /> {isSubmitting ? 'กำลังบันทึก...' : 'บันทึกส่งรายงานทางการ'}
              </button>
              <button onClick={() => handleSave(true)} disabled={isSubmitting} className="flex-1 inline-flex justify-center items-center gap-2 px-4 py-3 bg-amber-50 border border-amber-300 text-amber-800 rounded-md font-bold hover:bg-amber-100 transition-colors">
                <Clock className="w-5 h-5" /> ถ่ายรูปไว้ก่อน (เขียนทีหลัง)
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ReportCard({ report, dutyPoints, isOwner = false, triggerToast, teacherName, setTeacherName, onViewImage, settings }) {

      const point = dutyPoints.find(p => p.id === report.pointId);
      const shiftInfo = settings.shifts.find(s => s.id === report.shift) || { label: 'รอบเวรเก่า (ถูกลบไปแล้ว)' };

            {report.photoUrl ? (

    function InspectorView({ dutyPoints, reports, dailyComments, triggerToast, activeRole, onViewImage, settings }) {
      const [filterShift, setFilterShift] = useState('all');
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
      
      const [commentText, setCommentText] = useState('');
      const [commenterName, setCommenterName] = useState('');
      const [isSavingComment, setIsSavingComment] = useState(false);

      const activeReports = reports.filter(r => new Date(r.timestamp).toISOString().split('T')[0] === selectedDate);
      const filteredReports = filterShift === 'all' ? activeReports : activeReports.filter(r => r.shift === filterShift);
      const getMissingPoints = (shiftId) => {
        const reportedIds = new Set(activeReports.filter(r => r.shift === shiftId).map(r => r.pointId));
        return dutyPoints.filter(p => !reportedIds.has(p.id));
      };

      const dayComment = dailyComments.find(c => c.id === selectedDate) || {};

      useEffect(() => {
        if (activeRole === ROLES.INSPECTOR || activeRole === ROLES.HEAD) {
          setCommentText(dayComment.inspectorComment || '');
          setCommenterName(dayComment.inspectorName || '');
        } else if (activeRole === ROLES.EXECUTIVE || activeRole === ROLES.ADMIN) {
          setCommentText(dayComment.executiveComment || '');
          setCommenterName(dayComment.executiveName || '');
        }
      }, [selectedDate, dailyComments, activeRole]);

      const handleSaveComment = async (e) => {
        e.preventDefault();
        setIsSavingComment(true);
        try {
          const docRef = doc(db, 'artifacts', dutyAppId, 'public', 'data', 'dailyComments', selectedDate);
          let updateObj = { updatedAt: serverTimestamp() };
          if (activeRole === ROLES.INSPECTOR || activeRole === ROLES.HEAD) {
            updateObj.inspectorComment = commentText; updateObj.inspectorName = commenterName;
          } else if (activeRole === ROLES.EXECUTIVE || activeRole === ROLES.ADMIN) {
            updateObj.executiveComment = commentText; updateObj.executiveName = commenterName;
          }
          await setDoc(docRef, updateObj, { merge: true });
          triggerToast("บันทึกข้อเสนอแนะและข้อสั่งการลงในระบบเรียบร้อย", "success");
        } catch (err) { triggerToast("เกิดข้อผิดพลาดในการบันทึก", "error"); } finally { setIsSavingComment(false); }

              <div><label className="block text-xs text-gray-400 font-bold mb-1">เลือกวันที่ตรวจเวร</label><input type="date" value={selectedDate} onChange={(e) => { setSelectedDate(e.target.value); triggerToast(`แสดงข้อมูลวันที่: ${e.target.value}`, 'success'); }} className="border-gray-300 rounded-md text-sm shadow-sm px-2 py-1 focus:ring-indigo-500 focus:border-indigo-500" /></div>
              <div>
                <label className="block text-xs text-gray-400 font-bold mb-1">เลือกช่วงเวลา</label>

                  {settings.shifts.map(s => (
                    <button key={s.id} onClick={() => setFilterShift(s.id)} className={`px-3 py-1.5 text-xs font-semibold rounded-md ${filterShift === s.id ? 'bg-white shadow text-gray-800' : 'text-gray-500'}`}>{s.label.split(' ')[0]}</button>
                  ))}
                </div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 no-print">
            <h3 className="font-bold text-gray-800 flex items-center gap-2 mb-3"><Edit3 className="w-5 h-5 text-indigo-600" /> บันทึกข้อเสนอแนะและข้อสั่งการประจำวันที่เลือก (สิทธิ์: {activeRole})</h3>

              </div>
            </form>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 no-print">
            <div className="lg:col-span-1 space-y-4">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <h3 className="font-bold text-gray-800 flex items-center gap-2 mb-4"><AlertTriangle className="w-5 h-5 text-amber-500 animate-pulse" /> จุดที่ขาดเวร/ยังไม่ส่ง</h3>
                <div className="space-y-4">
                  {settings.shifts.filter(s => filterShift === 'all' || filterShift === s.id).map(shift => {

                        {missing.length === 0 ? <p className="text-xs text-green-600 font-medium bg-green-50 px-2 py-1 rounded">✔ ลงตรวจเวรครบทุกจุด</p> : (
                          <ul className="space-y-1.5">{missing.map(p => <li key={p.id} className="text-xs text-gray-600 flex items-center gap-1.5"><span className="w-1.5 h-1.5 bg-rose-400 rounded-full"></span><span>{p.name}</span></li>)}</ul>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
            <div className="lg:col-span-2 space-y-4">
              <h3 className="font-bold text-gray-800 flex items-center gap-2"><CheckCircle className="w-5 h-5 text-green-600" /> บันทึกการส่งรายงาน ({filteredReports.length} รายการ)</h3>
              {filteredReports.length === 0 ? <div className="bg-white rounded-xl p-8 text-center text-gray-400">ไม่มีผู้บันทึกเวรในหมวดหมู่นี้</div> : <div className="space-y-4">{filteredReports.map(report => <ReportCard key={report.id} report={report} dutyPoints={dutyPoints} onViewImage={onViewImage} settings={settings} />)}</div>}
            </div>
          </div>

          <div className="mt-8">
            <h3 className="font-bold text-gray-800 text-lg mb-3 flex items-center gap-2 no-print"><FileText className="w-5 h-5 text-indigo-600" /> พรีวิวกระดาษรายงานเวรทางการ</h3>
            <OfficialReportFormSheet selectedDate={selectedDate} dutyPoints={dutyPoints} reports={reports} dailyComments={dailyComments} settings={settings} />
          </div>
        </div>
      );
    }

    function SystemSettingsPanel({ settings, triggerToast }) {
      const [formData, setFormData] = useState(settings);
      const [isSaving, setIsSaving] = useState(false);

      useEffect(() => { setFormData(settings); }, [settings]);

      const handleSave = async (e) => {
        e.preventDefault();
        if (formData.shifts.length === 0) {
          triggerToast("ข้อผิดพลาด: ต้องมีช่วงเวลาเวรอย่างน้อย 1 ช่วง", "error"); return;
        }
        setIsSaving(true);
        try {
          const docRef = doc(db, 'artifacts', dutyAppId, 'public', 'data', 'settings', 'config');
          await setDoc(docRef, formData);
          triggerToast("อัปเดตการตั้งค่าระบบและรอบเวรสำเร็จ!", "success");
        } catch (err) {
          triggerToast("เกิดข้อผิดพลาดในการบันทึก", "error");
        } finally {
          setIsSaving(false);
        }
      };

      const handleAddShift = () => {
        const newShift = { id: `shift_${Date.now()}`, label: 'รอบเวรใหม่', time: '00.00 - 00.00 น.' };
        setFormData(prev => ({ ...prev, shifts: [...prev.shifts, newShift] }));
      };

      const handleRemoveShift = (id) => {
        setFormData(prev => ({ ...prev, shifts: prev.shifts.filter(s => s.id !== id) }));
      };

      const handleShiftChange = (id, field, value) => {
        setFormData(prev => ({
          ...prev, shifts: prev.shifts.map(s => s.id === id ? { ...s, [field]: value } : s)
        }));
      };

      return (
        <form onSubmit={handleSave} className="space-y-8 animate-scaleIn bg-white p-6 rounded-xl shadow-sm border border-gray-100 no-print">
          <div>
            <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2 mb-4 border-b pb-2"><Settings className="text-indigo-600" /> การตั้งค่าระบบหลัก (Core Configuration)</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">ชื่อระบบ / ชื่อโรงเรียนบนส่วนหัวเว็บไซต์</label>
                <input type="text" value={formData.schoolName} onChange={(e) => setFormData({...formData, schoolName: e.target.value})} className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500" required />
              </div>
            </div>
          </div>

          <div>
            <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2 mb-4 border-b pb-2"><Key className="text-amber-500" /> ระบบรักษาความปลอดภัย (PIN Access)</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-red-50 p-4 rounded-lg border border-red-100">
                <label className="block text-xs font-bold text-red-800 mb-1 uppercase">รหัส PIN : แอดมิน</label>
                <input type="text" value={formData.pins.admin} onChange={(e) => setFormData({...formData, pins: {...formData.pins, admin: e.target.value}})} className="w-full px-3 py-2 border border-red-200 rounded text-center font-bold tracking-widest bg-white" required />
              </div>
              <div className="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                <label className="block text-xs font-bold text-indigo-800 mb-1 uppercase">รหัส PIN : ผู้บริหาร</label>
                <input type="text" value={formData.pins.executive} onChange={(e) => setFormData({...formData, pins: {...formData.pins, executive: e.target.value}})} className="w-full px-3 py-2 border border-indigo-200 rounded text-center font-bold tracking-widest bg-white" required />
              </div>
              <div className="bg-green-50 p-4 rounded-lg border border-green-100">
                <label className="block text-xs font-bold text-green-800 mb-1 uppercase">รหัส PIN : หัวหน้าฝ่าย</label>
                <input type="text" value={formData.pins.head} onChange={(e) => setFormData({...formData, pins: {...formData.pins, head: e.target.value}})} className="w-full px-3 py-2 border border-green-200 rounded text-center font-bold tracking-widest bg-white" required />
              </div>
              <div className="bg-blue-50 p-4 rounded-lg border border-blue-100">
                <label className="block text-xs font-bold text-blue-800 mb-1 uppercase">รหัส PIN : ผู้ตรวจเวร</label>
                <input type="text" value={formData.pins.inspector} onChange={(e) => setFormData({...formData, pins: {...formData.pins, inspector: e.target.value}})} className="w-full px-3 py-2 border border-blue-200 rounded text-center font-bold tracking-widest bg-white" required />
              </div>
            </div>
          </div>

          <div>
            <div className="flex justify-between items-end mb-4 border-b pb-2">
              <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Clock className="text-indigo-600" /> จัดการรอบเวร (Dynamic Shifts)</h2>
              <button type="button" onClick={handleAddShift} className="text-xs bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-3 py-1.5 rounded-md font-bold flex items-center gap-1"><Plus className="w-3 h-3" /> เพิ่มรอบใหม่</button>
            </div>
            <p className="text-sm text-gray-500 mb-4">ตารางรายงานทางการจะสร้างแถวแบบอัตโนมัติตามจำนวนรอบที่คุณตั้งค่าไว้ด้านล่างนี้</p>
            
            <div className="space-y-3">
              {formData.shifts.map((shift, index) => (
                <div key={shift.id} className="flex flex-col sm:flex-row gap-3 items-center bg-gray-50 p-3 rounded-lg border border-gray-200">
                  <span className="font-bold text-gray-400 w-6 text-center">{index + 1}.</span>
                  <div className="flex-1 w-full">
                    <label className="block text-xs text-gray-500 font-bold mb-1">ชื่อเรียกช่วงเวลา (เช่น เช้า, กลางวัน)</label>
                    <input type="text" value={shift.label} onChange={(e) => handleShiftChange(shift.id, 'label', e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" required />
                  </div>
                  <div className="flex-1 w-full">
                    <label className="block text-xs text-gray-500 font-bold mb-1">เวลา (เช่น 06.30 - 08.00 น.)</label>
                    <input type="text" value={shift.time} onChange={(e) => handleShiftChange(shift.id, 'time', e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded text-sm" required />
                  </div>
                  <button type="button" onClick={() => handleRemoveShift(shift.id)} className="p-2 mt-4 text-red-500 hover:bg-red-100 rounded-md" title="ลบช่วงเวลานี้"><Trash2 className="w-5 h-5" /></button>
                </div>
              ))}
            </div>
          </div>

          <div className="pt-6 border-t border-gray-200 flex justify-end">
            <button type="submit" disabled={isSaving} className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-md flex items-center gap-2 transition-colors">
              <Save className="w-5 h-5" /> {isSaving ? "กำลังบันทึก..." : "บันทึกการตั้งค่าทั้งหมด"}
            </button>
          </div>
        </form>
      );
    }

    function AdminView({ dutyPoints, reports, dailyComments, triggerToast, triggerConfirm, onViewImage, settings }) {
      const [activeTab, setActiveTab] = useState('system'); 
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [isAddingPoint, setIsAddingPoint] = useState(false);
      const [newPointName, setNewPointName] = useState('');
      const [newPointLocation, setNewPointLocation] = useState('');

      const handleAddPoint = async (e) => {
        e.preventDefault();
        if (!newPointName) return;
        try {
          await addDoc(collection(db, 'artifacts', dutyAppId, 'public', 'data', 'dutyPoints'), { name: newPointName, location: newPointLocation, createdAt: serverTimestamp() });
          setIsAddingPoint(false); setNewPointName(''); setNewPointLocation('');
          triggerToast("เพิ่มจุดตรวจเวรสำเร็จ", "success");
        } catch (err) { triggerToast("เกิดข้อผิดพลาด", "error"); }
      };

      const handleDeletePoint = (id) => {
        triggerConfirm('ต้องการที่จะลบจุดตรวจเวรนี้ใช่หรือไม่?', async () => {
          try {
            await deleteDoc(doc(db, 'artifacts', dutyAppId, 'public', 'data', 'dutyPoints', id));
            triggerToast("ลบจุดตรวจเรียบร้อย", "success");
          } catch (err) {}
        });
      };

      const handleDeleteReportItem = (id) => {
        triggerConfirm('ยืนยันการลบรายงานบันทึกเวรนี้อย่างถาวรใช่หรือไม่?', async () => {
          try {
            await deleteDoc(doc(db, 'artifacts', dutyAppId, 'public', 'data', 'reports', id));
            triggerToast('ลบข้อมูลรายงานสำเร็จ', 'success');
          } catch (err) { triggerToast('เกิดข้อผิดพลาดในการลบข้อมูล', 'error'); }
        });
      };

      const handleCleanupData = () => {
        triggerConfirm('ยืนยันการลบข้อมูลที่เก่ากว่า 3 เดือนใช่หรือไม่? (การกระทำนี้จะลบถาวร ไม่สามารถกู้คืนได้)', async () => {
          try {
            const ninetyDaysAgo = Date.now() - (90 * 24 * 60 * 60 * 1000);
            let deletedCount = 0;
            const oldReports = reports.filter(r => r.timestamp < ninetyDaysAgo);
            for (const report of oldReports) { await deleteDoc(doc(db, 'artifacts', dutyAppId, 'public', 'data', 'reports', report.id)); deletedCount++; }
            
            const ninetyDaysAgoDate = new Date(ninetyDaysAgo).toISOString().split('T')[0];
            const oldComments = dailyComments.filter(c => c.id < ninetyDaysAgoDate);
            for (const comment of oldComments) { await deleteDoc(doc(db, 'artifacts', dutyAppId, 'public', 'data', 'dailyComments', comment.id)); }
            
            triggerToast(`ดำเนินการล้างข้อมูลเก่าเสร็จสิ้น (ลบไป ${deletedCount} รายการ)`, 'success');
          } catch (err) { triggerToast('เกิดข้อผิดพลาดในการลบข้อมูล', 'error'); }
        });
      };

      const getQrUrl = (pointId) => {
        const currentDomain = window.location.origin + window.location.pathname;
        return `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(`${currentDomain}?pointId=${pointId}`)}&margin=15`;
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap gap-2 sm:gap-4 border-b border-gray-200 no-print">
            <button onClick={() => setActiveTab('system')} className={`pb-2 px-1 font-bold text-sm transition-colors flex items-center gap-2 ${activeTab === 'system' ? 'border-b-2 border-indigo-600 text-indigo-700' : 'text-gray-500'}`}><Sliders className="w-4 h-4" /> ตั้งค่าระบบ</button>
            <button onClick={() => setActiveTab('dashboard')} className={`pb-2 px-1 font-bold text-sm transition-colors flex items-center gap-2 ${activeTab === 'dashboard' ? 'border-b-2 border-indigo-600 text-indigo-700' : 'text-gray-500'}`}><Shield className="w-4 h-4" /> แดชบอร์ดภาพรวม</button>
            <button onClick={() => setActiveTab('points')} className={`pb-2 px-1 font-bold text-sm transition-colors flex items-center gap-2 ${activeTab === 'points' ? 'border-b-2 border-indigo-600 text-indigo-700' : 'text-gray-500'}`}><Settings className="w-4 h-4" /> จุดตรวจ & QR</button>
            <button onClick={() => setActiveTab('database')} className={`pb-2 px-1 font-bold text-sm transition-colors flex items-center gap-2 ${activeTab === 'database' ? 'border-b-2 border-indigo-600 text-indigo-700' : 'text-gray-500'}`}><Database className="w-4 h-4" /> จัดการข้อมูลดิบ</button>
            <button onClick={() => setActiveTab('reports')} className={`pb-2 px-1 font-bold text-sm transition-colors flex items-center gap-2 ${activeTab === 'reports' ? 'border-b-2 border-indigo-600 text-indigo-700' : 'text-gray-500'}`}><FileText className="w-4 h-4" /> พิมพ์รายงานทางการ</button>
            <button onClick={() => setActiveTab('cleanup')} className={`pb-2 px-1 font-bold text-sm transition-colors flex items-center gap-2 ${activeTab === 'cleanup' ? 'border-b-2 border-indigo-600 text-indigo-700' : 'text-gray-500'}`}><Trash2 className="w-4 h-4" /> ล้างพื้นที่</button>
          </div>

          {activeTab === 'system' && <SystemSettingsPanel settings={settings} triggerToast={triggerToast} />}

          {activeTab === 'dashboard' && <InspectorView dutyPoints={dutyPoints} reports={reports} dailyComments={dailyComments} triggerToast={triggerToast} activeRole={ROLES.ADMIN} onViewImage={onViewImage} settings={settings} />}

          {activeTab === 'database' && (
            <div className="space-y-4 animate-scaleIn no-print">
              <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                <div><h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Database className="text-indigo-600 w-5 h-5" /> ฐานข้อมูลรายงานทั้งหมด (Raw Data)</h2><p className="text-sm text-gray-500">สามารถตรวจสอบและลบรายงานที่ผิดพลาดได้</p></div>
              </div>
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 text-gray-600 border-b"><tr><th className="px-4 py-3 font-bold">วัน-เวลา</th><th className="px-4 py-3 font-bold">จุดตรวจ</th><th className="px-4 py-3 font-bold">ช่วงเวลา</th><th className="px-4 py-3 font-bold">ผู้รายงาน</th><th className="px-4 py-3 font-bold">สถานะ</th><th className="px-4 py-3 font-bold text-center">จัดการ</th></tr></thead>
                    <tbody className="divide-y divide-gray-100">
                      {reports.length === 0 ? (<tr><td colSpan="6" className="text-center p-8 text-gray-400">ยังไม่มีข้อมูลในระบบ</td></tr>) : (
                        reports.map(report => {
                          const point = dutyPoints.find(p => p.id === report.pointId);
                          const shiftInfo = settings.shifts.find(s => s.id === report.shift);
                          const dateStr = new Date(report.timestamp).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
                          return (
                            <tr key={report.id} className="hover:bg-gray-50 transition-colors">
                              <td className="px-4 py-3 whitespace-nowrap text-gray-700">{dateStr}</td><td className="px-4 py-3 font-semibold text-gray-800">{point?.name || 'ไม่ระบุ'}</td><td className="px-4 py-3 text-gray-600">{shiftInfo?.label}</td><td className="px-4 py-3 text-gray-600">{report.userName}</td>
                              <td className="px-4 py-3">{report.status === 'normal' ? <span className="text-green-600 bg-green-50 px-2 py-0.5 rounded text-xs font-bold">ปกติ</span> : <span className="text-red-600 bg-red-50 px-2 py-0.5 rounded text-xs font-bold">ผิดปกติ</span>}</td>
                              <td className="px-4 py-3 text-center"><button onClick={() => handleDeleteReportItem(report.id)} className="p-1.5 text-red-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors" title="ลบรายงานนี้"><Trash2 className="w-4 h-4" /></button></td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'points' && (
            <div className="space-y-6 no-print animate-scaleIn">
              <div className="flex justify-between items-center gap-3">
                <div><h2 className="text-xl font-bold text-gray-800">ระบบจัดการตำแหน่งจุดตรวจ</h2><p className="text-sm text-gray-500">สร้าง QR Code เพื่อให้ผู้รายงานสแกนตรงจากพื้นที่ตรวจได้ทันที</p></div>
                <button onClick={() => setIsAddingPoint(!isAddingPoint)} className="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-md text-sm font-semibold hover:bg-indigo-700">{isAddingPoint ? <X className="w-4 h-4" /> : <Plus className="w-4 h-4" />}{isAddingPoint ? 'ปิดแบบฟอร์ม' : 'เพิ่มจุดใหม่'}</button>
              </div>

              {isAddingPoint && (
                <div className="bg-white p-5 rounded-xl shadow-sm border border-indigo-100 animate-scaleIn">
                  <form onSubmit={handleAddPoint} className="flex flex-col sm:flex-row gap-4 items-end">
                    <div className="flex-1 w-full"><label className="block text-sm font-bold text-gray-700 mb-1">ชื่อจุดตรวจเวร *</label><input type="text" required value={newPointName} onChange={(e) => setNewPointName(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-md sm:text-sm" /></div>
                    <div className="flex-1 w-full"><label className="block text-sm font-bold text-gray-700 mb-1">คำอธิบาย</label><input type="text" value={newPointLocation} onChange={(e) => setNewPointLocation(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-md sm:text-sm" /></div>
                    <button type="submit" className="px-6 py-2 bg-green-600 text-white rounded-md text-sm font-bold hover:bg-green-700 h-[38px]">บันทึกข้อมูล</button>
                  </form>
                </div>
              )}

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {dutyPoints.map(point => (
                  <div key={point.id} className="bg-white rounded-xl shadow-md border border-gray-100 p-5 flex flex-col justify-between hover:shadow-lg transition-shadow">
                    <div className="flex justify-between items-start">
                      <div><h3 className="font-bold text-gray-800 text-lg flex items-center gap-1"><MapPin className="w-5 h-5 text-indigo-500" />{point.name}</h3><p className="text-sm text-gray-500 mt-1">{point.location || '-'}</p></div>
                      <button onClick={() => handleDeletePoint(point.id)} className="p-1.5 text-gray-400 hover:text-red-600 rounded bg-gray-50"><Trash2 className="w-4.5 h-4.5" /></button>
                    </div>
                    <div className="mt-6 pt-4 border-t border-gray-100 space-y-3">
                      <div className="flex items-center gap-3">
                        <div className="w-20 h-20 bg-white border border-gray-200 p-1 rounded-md shadow-sm flex-shrink-0"><img src={getQrUrl(point.id)} alt="QR Code" className="w-full h-full object-cover" /></div>
                        <div className="text-xs text-gray-400 space-y-1"><span className="font-bold text-gray-600 block">บาร์โค้ดลงทะเบียนทันที</span><span>เมื่อสแกนด้วยกล้องมือถือ จะเด้งเข้าสู่ฟอร์มบันทึกเวลาโดยตรง</span></div>
                      </div>
                      <div className="flex justify-between items-center gap-2 pt-2">
                        <a href={getQrUrl(point.id)} download={`QR_${point.name}.png`} target="_blank" rel="noreferrer" className="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded font-semibold flex items-center gap-1 w-full justify-center"><Download className="w-3.5 h-3.5" /> ดาวน์โหลดภาพสำหรับปรินต์</a>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {activeTab === 'reports' && (
            <div className="space-y-6 animate-scaleIn">
              <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center gap-4 no-print">
                <div><h2 className="text-lg font-bold text-gray-800">ค้นหาตารางบันทึกรายงานเวรทางการ</h2></div>
                <div className="flex items-center gap-2"><label className="text-sm text-gray-600 font-bold">เลือกวันที่ย้อนหลัง:</label><input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="border-gray-300 rounded-md shadow-sm text-sm px-2 py-1" /></div>
              </div>
              <OfficialReportFormSheet selectedDate={selectedDate} dutyPoints={dutyPoints} reports={reports} dailyComments={dailyComments} settings={settings} />
            </div>
          )}

          {activeTab === 'cleanup' && (
            <div className="space-y-6 no-print animate-scaleIn">
              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2 mb-2"><Database className="text-indigo-600 w-5 h-5" /> การจัดการพื้นที่จัดเก็บข้อมูล (Storage Management)</h2>
                <p className="text-sm text-gray-500 mb-6">แนะนำให้พิมพ์รายงานเก็บไว้และแวะมาล้างข้อมูลเก่าๆ ทุก 3 เดือน เพื่อไม่ให้พื้นที่ฐานข้อมูลเต็มและป้องกันระบบทำงานช้า</p>
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between p-5 bg-red-50 rounded-lg border border-red-100 gap-4">
                   <div>
                      <h4 className="font-bold text-red-800">ลบข้อมูลรายงานที่เก่ากว่า 3 เดือน (90 วัน)</h4>
                      <p className="text-xs text-red-600 mt-1">ลบรายงาน รูปภาพ และข้อเสนอแนะต่างๆ อย่างถาวร ไม่สามารถกู้คืนได้</p>
                   </div>
                   <button onClick={handleCleanupData} className="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow-sm text-sm transition-colors flex items-center gap-2 whitespace-nowrap"><Trash2 className="w-4 h-4" /> กดเพื่อล้างข้อมูลเก่า</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function OfficialReportFormSheet({ selectedDate, dutyPoints, reports, dailyComments, settings }) {
      const formatThaiDate = (dateString) => {
        if (!dateString) return '';
        const d = new Date(dateString);
        const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        return `วัน${d.toLocaleDateString('th-TH', { weekday: 'long' })} ที่ ${d.getDate()} เดือน ${months[d.getMonth()]} พ.ศ. ${d.getFullYear() + 543}`;
      };

      const getCellReport = (pointId, shiftId) => reports.find(r => new Date(r.timestamp).toISOString().split('T')[0] === selectedDate && r.pointId === pointId && r.shift === shiftId);

      const renderReportDetail = (report) => {
        if (!report) return <div className="mt-2 text-gray-300"><div className="border-b border-dotted border-gray-400 w-full mb-4"></div><div className="border-b border-dotted border-gray-400 w-full mb-2"></div></div>;
        return (
          <div className="mt-2 space-y-1">
            <div className="flex items-center gap-2">
              {report.status === 'normal' ? <span className="text-green-700 font-bold text-sm">✔ เหตุการณ์ปกติ</span> : <span className="text-red-700 font-bold text-sm">⚠ มีเหตุผิดปกติ</span>}
              <span className="text-gray-500 text-xs">(เวลา {new Date(report.timestamp).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.)</span>
            </div>
            {report.detail && <div className="text-gray-800 text-sm whitespace-pre-wrap">{report.detail}</div>}
          </div>
        );
      };

      const dayComment = dailyComments.find(c => c.id === selectedDate) || {};

      return (
        <div className="space-y-4">
          <div className="flex justify-end no-print">
            <button onClick={() => window.print()} className="inline-flex items-center gap-2 px-5 py-2.5 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 shadow"><Printer className="w-5 h-5" /> พิมพ์แบบรายงานเวรทางการ (A4)</button>
          </div>
          
          <div className="bg-white p-8 rounded-xl border border-gray-200 shadow-md print-container print:p-0 print:border-none print:shadow-none print-full-width">
            <div className="text-center space-y-2 pb-6 mb-6 border-b">
              <h1 className="text-xl sm:text-2xl font-bold text-gray-900">สมุดบันทึกรายงานการปฏิบัติเวรประจำจุด</h1>
              <p className="text-md text-gray-800 font-bold mt-2">ประจำ{formatThaiDate(selectedDate)}</p>
            </div>
            
            <div className="overflow-x-auto">
              <table className="min-w-full border-collapse border border-black">
                <thead>
                  <tr className="bg-gray-50">
                    <th className="px-4 py-3 border border-black text-center text-md font-bold text-gray-900 w-[20%]">เวรประจำจุด</th>
                    <th className="px-4 py-3 border border-black text-center text-md font-bold text-gray-900 w-[55%]">บันทึกเวร</th>
                    <th className="px-4 py-3 border border-black text-center text-md font-bold text-gray-900 w-[25%]">ผู้รายงาน</th>
                  </tr>
                </thead>
                <tbody className="bg-white">
                  {dutyPoints.map((point) => {
                    const pointReports = settings.shifts.map(s => getCellReport(point.id, s.id));
                    const uniqueReporters = [...new Set(pointReports.filter(Boolean).map(r => r.userName))];
                    const numShifts = settings.shifts.length || 1;

                    return (
                      <React.Fragment key={point.id}>
                        {settings.shifts.map((shift, idx) => {
                          const report = pointReports[idx];
                          if (idx === 0) {
                            return (
                              <tr key={shift.id}>
                                <td rowSpan={numShifts} className="px-4 py-4 border border-black align-top text-center"><div className="font-bold text-gray-900 text-lg">{point.name}</div></td>
                                <td className="px-4 py-3 border border-black align-top min-h-[80px]"><div className="font-bold text-gray-900">{shift.label}</div>{renderReportDetail(report)}</td>
                                <td rowSpan={numShifts} className="px-4 py-4 border border-black align-top text-center">
                                  {uniqueReporters.length > 0 ? <div className="space-y-4 mt-2">{uniqueReporters.map((name, i) => <div key={i} className="text-sm font-semibold text-gray-800">{name}</div>)}</div> : <div className="flex flex-col h-full justify-center text-gray-300 italic text-sm">(ลงนามผู้ปฏิบัติเวร)</div>}
                                </td>
                              </tr>
                            );
                          } else {
                            return (
                              <tr key={shift.id}>
                                <td className="px-4 py-3 border border-black align-top min-h-[80px]"><div className="font-bold text-gray-900">{shift.label}</div>{renderReportDetail(report)}</td>
                              </tr>
                            );
                          }
                        })}
                        {/* Fallback for empty shifts */}
                        {settings.shifts.length === 0 && (
                           <tr>
                             <td className="px-4 py-4 border border-black align-top text-center"><div className="font-bold text-gray-900 text-lg">{point.name}</div></td>
                             <td className="px-4 py-3 border border-black align-top min-h-[80px]"><div className="text-gray-400 italic">ยังไม่มีการตั้งค่ารอบเวร</div></td>
                             <td className="px-4 py-4 border border-black align-top text-center"></td>
                           </tr>
                        )}
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div className="mt-8 space-y-6 border border-black p-4 rounded-lg">
              <div>
                <h4 className="font-bold text-md text-gray-900 flex items-center gap-1">
                  <span>ข้อเสนอแนะของผู้ตรวจเวร:</span>
                </h4>
                <div className="text-sm text-gray-800 min-h-[40px] pl-4 pt-1 whitespace-pre-wrap leading-relaxed">
                  {dayComment.inspectorComment ? dayComment.inspectorComment : <span className="text-gray-300 italic block">...................................................................................................................................................................................</span>}
                </div>
                {dayComment.inspectorName && <p className="text-right text-xs font-semibold text-gray-700 mt-2">ลงชื่อ: {dayComment.inspectorName}</p>}
              </div>

              <div className="border-t border-gray-300 pt-4">
                <h4 className="font-bold text-md text-gray-900 flex items-center gap-1">
                  <span>ข้อสั่งการ/ข้อเสนอแนะของผู้บริหาร:</span>
                </h4>
                <div className="text-sm text-gray-800 min-h-[40px] pl-4 pt-1 whitespace-pre-wrap leading-relaxed">
                  {dayComment.executiveComment ? dayComment.executiveComment : <span className="text-gray-300 italic block">...................................................................................................................................................................................</span>}
                </div>
                {dayComment.executiveName && <p className="text-right text-xs font-semibold text-gray-700 mt-2">ลงชื่อ: {dayComment.executiveName}</p>}
              </div>
            </div>

            <div className="mt-12 grid grid-cols-1 md:grid-cols-3 gap-8 print:grid-cols-3">
              <div className="text-center space-y-8 flex flex-col justify-between">
                <h4 className="text-xs font-bold text-gray-400 uppercase">ฝ่ายผู้ยืนเวรตรวจ</h4>
                <div className="space-y-2">
                  <p className="text-sm">ลงชื่อ......................................................</p>
                  <p className="text-xs text-gray-400">ข้าราชการครูและบุคลากรประจำวัน</p>
                </div>
              </div>
              <div className="text-center space-y-8 flex flex-col justify-between border-t md:border-t-0 md:border-x border-gray-200 py-4 md:py-0">
                <h4 className="text-xs font-bold text-gray-400 uppercase">ฝ่ายตรวจสอบและสรุป</h4>
                <div className="space-y-2">
                  <p className="text-sm">{dayComment.inspectorName ? `( ${dayComment.inspectorName} )` : "ลงชื่อ......................................................"}</p>
                  <p className="text-xs text-gray-400">ผู้รับผิดชอบสายตรวจโรงเรียน</p>
                </div>
              </div>
              <div className="text-center space-y-8 flex flex-col justify-between">
                <h4 className="text-xs font-bold text-gray-400 uppercase">ฝ่ายรับรองและสั่งการ</h4>
                <div className="space-y-2">
                  <p className="text-sm">{dayComment.executiveName ? `( ${dayComment.executiveName} )` : "ลงชื่อ......................................................"}</p>
                  <p className="text-xs text-gray-400">ผู้อำนวยการโรงเรียนหรือผู้รักษาการแทน</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 7. Render Application DOM ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
